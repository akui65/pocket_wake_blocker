# ==============================================================
#  口袋防误触模块 v1.7 - 配置文件
#  修改后保存即可，重启设备（或重启模块）后生效。
# ==============================================================

# 息屏/DOZE 状态轮询间隔（秒），支持小数。
# 这是双击拦截的响应粒度：越小息屏越快，但 dumpsys 轮询更耗电。
# 默认 1 秒，双击误触最多 1 秒内被息屏（可接受）。
POLL_INTERVAL=1.0

# 亮屏状态轮询间隔（秒）。亮屏时只需捕捉"ON→OFF"边缘（用于重新启动
# 传感器守护），不需要高频轮询。默认 2 秒。
POLL_INTERVAL_ON=2

# 息屏阶段每间隔多少个轮询周期缓存一次接近值（约每 12 秒一次）。
# 缓存只是兜底（传感器守护在线时现场读取是实时的），无需频繁。
# 若嫌耗电可调大（如 20），若嫌缓存太旧可调小（如 6）。
PROX_POLL_EVERY=12

# 确认延迟（秒）：检测到接近"近"后，再等待该时长并二次确认，
# 避免单次误判误熄屏。正常双击亮屏不会因此被误杀。
CONFIRM_DELAY=0.2

# 接近事件新鲜度阈值（秒）：仅在"常驻采样守护进程离线"时起作用——
# 此时传感器可能休眠、dumpsys 的"最近事件"会残留旧值（如之前进过口袋
# 留下的 0.00=近），超过该秒数没有新事件就视为"当前没有遮挡"，直接放行，
# 避免误熄屏。守护进程在线时传感器实时上报，读到"近"即当前遮挡，不受此限制。
FRESH_AGE=2

# 电源键豁免窗口（秒）：电源键按下后该秒数内的亮屏，直接放行，
# 不检测距离传感器（本模块只作用于双击亮屏等误触）。
POWER_KEY_WINDOW=2

# 调试开关：1 输出更详细日志（含接近值读取失败等）
DEBUG=0
